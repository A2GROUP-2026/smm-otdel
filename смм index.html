<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>html,body{height:100%;margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Контент-план</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;600;700&family=Nunito:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky bar with brand switch and tabs; left rail = folders (path of a topic from idea to published) + formats; main = dense list or month calendar; one side panel for every form. Single deliberate look: everything in shades of pink, red reserved for missed dates. */
:root{
  color-scheme:light;
  --bg:#FFF2F7; --surface:#FFFFFF; --raise:#FFE8F0; --ink:#5B2440; --muted:#A8718B; --line:#F9CFDF;
  --accent:#EE5C97; --accent-ink:#FFFFFF; --soft:#FFD9E7; --deep:#C4326F;
  --late:#D81B43; --late-bg:#FFE0E3;
  --st-idea:#F7A8C6; --st-review:#F06FA6; --st-rework:#F48A8F; --st-rejected:#C9A3B4; --st-approved:#E9498C; --st-prod:#D33A8A; --st-check:#C8327F; --st-ready:#B92D74; --st-done:#8E1F56;
  --display:"Comfortaa","Nunito",system-ui,sans-serif;
  --font:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --shadow:0 12px 40px rgba(196,50,111,.18);
  --rowh:56px; --pad:16px;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--deep);outline-offset:2px}
svg.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.auth{min-height:100%;display:grid;place-items:center;padding:48px 16px}
.auth-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.mark{font-family:var(--display);font-weight:700;font-size:16px;display:flex;align-items:center;gap:9px;color:var(--deep);white-space:nowrap}
.mark img{width:44px;height:auto;flex:none}
.hk{mix-blend-mode:multiply;user-select:none;pointer-events:none}
.hk.big{width:120px;align-self:center}
.hk.peek{position:fixed;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:62px;z-index:4}
.rail-hk{display:block;width:104px;margin:14px auto 6px}
.auth h1{font-family:var(--display);font-size:21px;margin:0;line-height:1.25;text-wrap:balance}
.auth p{margin:0;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:13px;font-weight:600;color:var(--muted)}
.inp{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;min-height:40px}
.inp:hover{border-color:var(--st-idea)}
textarea.inp{resize:vertical;min-height:76px}
.check{display:flex;gap:9px;align-items:center;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.err{color:var(--late);font-size:14px;margin:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;min-height:40px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--deep);border-color:var(--deep)}
.btn.soft{background:var(--soft);border-color:var(--soft);color:var(--deep)}
.btn.danger{color:var(--late)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.small{min-height:32px;padding:4px 12px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:default}
.who{display:flex;flex-direction:column;gap:8px}
.who .btn{justify-content:flex-start}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:1360px;margin:0 auto;padding:10px 16px;display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:2px;background:var(--raise);border-radius:999px;padding:3px;flex-wrap:wrap}
.tab{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs.brand .tab[aria-selected="true"]{background:var(--surface);color:var(--deep);box-shadow:0 0 0 1px var(--line)}
.search{flex:1 1 180px;min-width:0;border-radius:999px}
.bar-actions{display:flex;gap:8px;flex-wrap:wrap}
.me{font-size:13px;color:var(--muted);white-space:nowrap}
.demo{background:var(--soft);color:var(--deep);text-align:center;font-size:13.5px;padding:6px 16px;font-weight:600}
.wrap{max-width:1360px;margin:0 auto;padding-inline:16px;padding-block:18px 60px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;align-items:start}

.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100vh - 100px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px}
.rail h3{font-family:var(--display);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 12px 4px}
.rail-i{width:100%;border:0;background:transparent;text-align:left;border-radius:12px;min-height:38px;padding:0 12px;display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14.5px}
.rail-i span{line-height:1.25;padding:4px 0}
.rail-i:hover{background:var(--raise)}
.rail-i[aria-current="true"]{background:var(--soft);color:var(--deep);font-weight:700}
.rail-i b{font-weight:500;color:var(--muted);font-size:13px;min-width:22px;text-align:right}
.rail-i.late{color:var(--late)} .rail-i.late b{color:var(--late);font-weight:700}
.rail hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px;min-height:44px}
.tools h2{font-family:var(--display);margin:0;font-size:19px;font-weight:700;line-height:1.25;flex:1 1 200px;min-width:0}
.tools h2 small{display:block;font-family:var(--font);font-size:13px;font-weight:400;color:var(--muted);margin-top:2px}
.filters{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.filters .tabs{border-radius:22px;align-self:flex-start;max-width:100%}
.filters .tab i{font-style:normal;font-weight:500;opacity:.7;font-size:13px;margin-left:3px}
.filters .tab.late{color:var(--late)}
.filters .folders{display:none}
.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.board{display:flex;gap:12px;overflow-x:auto;align-items:flex-start;padding-bottom:10px}
.col{flex:1 0 248px;max-width:340px;min-width:0;background:var(--raise);border-radius:20px;padding:8px;display:flex;flex-direction:column;gap:8px}
.col-h{display:flex;align-items:center;gap:8px;padding:6px 8px 2px;font-family:var(--display);font-weight:700;font-size:14px;color:var(--deep)}
.col-h span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col-h b{font-family:var(--font);font-weight:600;color:var(--muted);font-size:13px}
.col-h i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.col-e{font-size:13px;color:var(--muted);text-align:center;padding:14px 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:11px 12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;min-width:0}
.card:hover{border-color:var(--accent);box-shadow:0 4px 14px rgba(196,50,111,.12)}
.card.late{background:var(--late-bg);border-color:var(--late)}
.card>b{font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.card>em{font-style:normal;font-size:13px;color:var(--late);font-weight:600}
.c-meta{display:flex;flex-direction:column;gap:3px;font-size:13.5px;color:var(--muted)}
.r-fmt{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.r-date{font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;align-items:center;gap:7px}
.r-date.late{color:var(--late);font-weight:700}
.r-date input{width:18px;height:18px;accent-color:var(--accent);margin:0;flex:none;cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 9px;line-height:18px;background:var(--soft);color:var(--deep);white-space:nowrap}
.chip.pf{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted);font-weight:600;padding:2px 7px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;white-space:nowrap;border-radius:999px;padding:3px 11px;line-height:18px;color:#fff;background:var(--c)}
.st.idea{color:var(--ink)}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;font-family:var(--display);color:var(--ink);font-size:16px;margin-bottom:4px}
.empty img{width:120px;display:block;margin:0 auto 8px}

.cal-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.cal-head h2{font-family:var(--display);margin:0;font-size:19px;min-width:190px;text-transform:capitalize}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-left:auto;align-items:center}
.cal-scroll{overflow-x:auto;border-radius:18px}
.cal{min-width:660px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--line);gap:1px;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.cal .wd{background:var(--raise);font-size:12.5px;font-weight:700;color:var(--muted);padding:7px 8px;text-transform:uppercase;letter-spacing:.05em}
.day{background:var(--surface);min-height:118px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cal.week .day{min-height:320px}
.day.out{background:var(--bg)} .day.out .dn{color:var(--st-rejected)}
.dn{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.day.today .dn span{background:var(--accent);color:#fff;border-radius:999px;padding:0 8px}
.plus{border:0;background:transparent;color:var(--st-idea);font-weight:700;font-size:16px;line-height:1;padding:2px 6px;border-radius:8px}
.plus:hover{background:var(--soft);color:var(--deep)}
.ev{border:0;text-align:left;width:100%;border-radius:8px;padding:3px 7px;font-size:12.5px;line-height:1.3;font-weight:600;background:var(--c);color:#fff;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ev.idea{color:var(--ink)}
.ev.shoot{background:var(--surface);color:var(--deep);box-shadow:inset 0 0 0 1.5px var(--st-idea)}
.ev.late{background:var(--late-bg);color:var(--late);box-shadow:inset 0 0 0 1.5px var(--late)}
.ev.slot{background:transparent;color:var(--muted);box-shadow:none;border:1.5px dashed var(--st-idea);font-weight:500}
.ev.slot:hover{background:var(--soft)}

.scrim{position:fixed;inset:0;background:rgba(91,36,64,.32);z-index:20;display:flex;justify-content:flex-end}
.panel{width:min(600px,100%);height:100%;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column}
.p-head{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 14px;border-bottom:1px solid var(--line)}
.p-head h2{font-family:var(--display);margin:0;font-size:18px;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.p-body{padding:18px 20px;overflow:auto;display:flex;flex-direction:column;gap:16px;flex:1}
.p-foot{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.hint{font-size:13px;color:var(--muted);margin:0}
.warnbox{background:var(--late-bg);color:var(--late);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600}
.decide{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.decide .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.togs{display:flex;flex-wrap:wrap;gap:6px}
.tog{position:relative}
.tog input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.tog span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13.5px;font-weight:600;color:var(--muted)}
.tog input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tog input:focus-visible+span{outline:2px solid var(--deep);outline-offset:2px}
.log{display:flex;flex-direction:column;gap:8px;font-size:14px}
.log div{border-left:3px solid var(--soft);padding-left:10px}
.log small{color:var(--muted);display:block}
.person{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.setrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center}
.rule{display:flex;flex-direction:column;gap:6px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.rule b{font-size:14px}
.rule .line{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.rule input[type=time]{width:120px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;overflow-wrap:anywhere;user-select:all}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:999px;z-index:40;max-width:calc(100% - 32px);font-size:14px}
.menu{position:relative}
.menu-list{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:6px;min-width:250px;z-index:10;display:flex;flex-direction:column}
.menu-list button{border:0;background:none;text-align:left;padding:8px 12px;border-radius:10px}
.menu-list button:hover{background:var(--raise)}

@media (max-width:900px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .filters .folders{display:flex}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .me{display:none}
  .hk.peek{width:44px}
  .legend{margin-left:0}
}
@media (prefers-reduced-motion:no-preference){ .panel{animation:slide .18s ease-out} @keyframes slide{from{transform:translateX(24px)}to{transform:none}} }
</style>
</head>
<body>

<div id="auth" class="auth">
  <div class="auth-card">
    <div class="mark"><img class="hk" data-hk="head" alt="">Контент-план</div>
    <img class="hk big" data-hk="wave" alt="">
    <div id="authBody"><p>Загрузка…</p></div>
  </div>
</div>

<div id="app" hidden>
  <div class="demo" id="demoBar" hidden>Демо-просмотр: темы для примера, изменения не сохраняются. В «Ещё → Сменить имя» можно зайти под другой ролью: согласующий, участник или просмотр.</div>
  <header class="bar"><div class="bar-in">
    <div class="mark"><img class="hk" data-hk="head" alt="">Контент-план</div>
    <div class="tabs brand" id="brandTabs" role="tablist" aria-label="Бренд"></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-act="tab" data-tab="list" aria-selected="true">Темы</button>
      <button class="tab" role="tab" data-act="tab" data-tab="cal" aria-selected="false">Календарь</button>
    </div>
    <input id="q" class="inp search" type="search" placeholder="Поиск по темам" autocomplete="off">
    <div class="bar-actions">
      <button class="btn primary" data-act="add">Предложить тему</button>
      <button class="btn" data-act="import" data-edit>Вставить списком</button>
      <div class="menu">
        <button class="btn" data-act="menu" aria-haspopup="true">Ещё</button>
        <div class="menu-list" id="menuList" hidden>
          <button data-act="rules" data-admin>Регламент публикаций</button>
          <button data-act="people" data-admin>Люди и роли</button>
          <button data-act="brands" data-admin>Бренды</button>
          <button data-act="yg" data-admin>Связь с YouGile</button>
          <button data-act="ical" data-admin>Яндекс Календарь</button>
          <button data-act="export">Выгрузить в Excel (CSV)</button>
          <button data-act="who">Сменить имя</button>
          <button data-act="passwd" data-admin>Сменить логин и пароль</button>
          <button data-act="logout">Выйти</button>
        </div>
      </div>
    </div>
    <span class="me" id="meLabel"></span>
  </div></header>
  <div class="wrap" id="wrap">
    <nav class="rail" id="rail" aria-label="Папки"></nav>
    <main id="main"></main>
  </div>
</div>

<div id="scrim" class="scrim" hidden><aside class="panel" id="panel" role="dialog" aria-modal="true"></aside></div>
<img class="hk peek" data-hk="peek" alt="">
<div id="toast" class="toast" hidden></div>

<script>
(function(){
"use strict";
var DEMO=!/\.github\.io$/.test(location.hostname);
var STATUS=[
 {id:"idea",name:"Идеи"},{id:"review",name:"На согласовании"},{id:"rework",name:"На доработке"},{id:"rejected",name:"Отклонено"},

/* ---------- crypto: data is AES-GCM encrypted with a data key; the data key is wrapped by a key derived from login+password ---------- */
async function deriveKek(login,pass,saltB64,iter){
  var salt0=unb64(saltB64),lg=te.encode(login.trim().toLowerCase()),salt=new Uint8Array(salt0.length+lg.length);salt.set(salt0);salt.set(lg,salt0.length);

  return crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
function importDek(raw){return crypto.subtle.importKey("raw",raw,"AES-GCM",true,["encrypt","decrypt"])}
async function seal(obj,key){var iv=rnd(12);var ct=await crypto.subtle.encrypt({name:"AES-GCM",iv:iv},key||S.dek,te.encode(JSON.stringify(obj)));return{iv:b64(iv),ct:b64(ct)}}
async function unseal(d,key){var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(d.iv)},key||S.dek,unb64(d.ct));return JSON.parse(td.decode(pt))}
async function makeVault(login,pass,dekRaw,extra){
  var salt=b64(rnd(16)),iter=210000,kek=await deriveKek(login,pass,salt,iter),iv=rnd(12);
  var wrapped=await crypto.subtle.encrypt({name:"AES-GCM",iv:iv},kek,dekRaw);
  var dek=await importDek(dekRaw),chk=await seal("ok",dek);

}

/* ---------- YouGile: topics sent for approval become tasks; the task follows the topic through the board ---------- */
var YG="https://yougile.com/api-v2";
async function ygCall(path,method,body,key){
  var r=await fetch(YG+path,{method:method||"GET",headers:Object.assign({"Content-Type":"application/json"},key===false?{}:{Authorization:"Bearer "+(key||S.data.yg.key)}),body:body?JSON.stringify(body):undefined});
  if(!r.ok)throw{code:"yg",status:r.status};return r.json();
}
var YG_COL={idea:"01",review:"02",rework:"02",approved:"03",prod:"03",check:"04",ready:"05",done:"06"},COL_ST={"01":"idea","02":"review","03":"approved","04":"check","05":"ready","06":"done"};
async function ygResolve(key){
  var users=(await ygCall("/users?limit=1000","GET",null,key)).content||[],projects=(await ygCall("/projects?limit=1000","GET",null,key)).content||[],cols={};
  for(var i=0;i<S.data.brands.length;i++){
    var b=S.data.brands[i],word=norm(b.name).replace(/[«»"]/g,"").split(/\s+/).filter(function(w){return w.length>2}).pop()||"",pr=projects.filter(function(p){return /smm|контент/i.test(p.title)&&norm(p.title).indexOf(word)>=0})[0];
    if(!pr)continue;var boards=(await ygCall("/boards?limit=1000&projectId="+pr.id,"GET",null,key)).content||[];if(!boards[0])continue;
    var cl=(await ygCall("/columns?limit=1000&boardId="+boards[0].id,"GET",null,key)).content||[],m={};
    cl.forEach(function(c){var n=(c.title.match(/^\s*(\d\d)/)||[])[1];if(n)m[n]=c.id});cols[b.id]={project:pr.title,map:m};
  }
  return{key:key,cols:cols,ulist:users.map(function(u){return{id:u.id,name:u.realName||u.email}})};
}
function ygGuess(name,ulist){var tr={"anton":"антон","andrey":"андрей","andrei":"андрей","alexandra":"александра","aleksandra":"александра","maria":"мария","mariya":"мария"},n=norm(name).split(" ")[0];
  var u=ulist.filter(function(x){var f=norm(x.name).split(" ")[0];return f===n||tr[f]===n})[0];return u?u.id:undefined}

/* Two-way: a card moved in YouGile moves the topic here; new cards in "01" become ideas. ygCol = the column this site last saw the task in, so we can tell who moved it. */
var pulling=false;
async function ygPull(){
  var yg=S.data&&S.data.yg;if(DEMO||pulling||!yg||!yg.key)return;pulling=true;
  try{
    var moves={},adds=[],retry=[],now=Date.now(),linked={},nos=Object.keys(COL_ST);S.list.forEach(function(x){if(x.ygId)linked[x.ygId]=x});
    for(var bi=0;bi<S.data.brands.length;bi++){
      var b=S.data.brands[bi],cfg=yg.cols[b.id];if(!cfg)continue;
      for(var ci=0;ci<nos.length;ci++){
        var no=nos[ci],cid=cfg.map[no];if(!cid)continue;
        (await ygTasks(cid)).forEach(function(t){
          if(t.deleted||t.archived)return;var x=linked[t.id];
          if(x){if(x.status==="rejected"||now-(x.updated||0)<20000)return;
            if(no!==x.ygCol)moves[x.id]=YG_COL[x.status]!==no?{st:COL_ST[no],col:no}:{col:no};
            else if(YG_COL[x.status]!==no)retry.push(x.id)}
          else if(no==="01"&&!(yg.skip||{})[t.id])adds.push({brand:b.id,t:t});
        });
      }
    }
    if(Object.keys(moves).length||adds.length)await mutate(function(d){
      var have={};Object.keys(d.items).forEach(function(k){if(d.items[k].ygId)have[d.items[k].ygId]=1});
      Object.keys(moves).forEach(function(id){var it=d.items[id],m=moves[id];if(!it)return;it.ygCol=m.col;if(m.st){it.status=m.st;it.updated=now;it.log.push({t:now,who:null,kind:m.st,text:"перенесено в YouGile"})}});
      adds.forEach(function(a,i){if(have[a.t.id])return;d.items[newId()]=Object.assign({brand:a.brand,title:String(a.t.title).replace(/^\s*ИДЕЯ\s*[|:—-]\s*/i,""),owner:"",cast:[],crew:[],status:"idea",author:null,ai:true,ygId:a.t.id,ygCol:"01",created:now,updated:now-30000+i,log:[{t:now,who:null,kind:"new",text:""}]},ygParse(a.t))});
    });
    for(var ri=0;ri<retry.length;ri++)await ygSync(retry[ri]);
  }catch(e){}finally{pulling=false}
}

function icsText(){

  S.list.filter(function(x){return x.status!=="rejected"}).sort(function(a,b){return a.id<b.id?-1:1}).forEach(function(x){
    var br=(byId(S.data.brands,x.brand)||{}).name||"",info=e(stName(x.status)+" · "+br+(pname(x.owner)?" · "+pname(x.owner):""));
    if(x.pub){L.push("BEGIN:VEVENT","UID:"+x.id+"-pub@kontent","DTSTAMP:"+stamp);
      if(x.pubTime){var a=pd(x.pub),hm=x.pubTime.split(":"),u=new Date(Date.UTC(a.getFullYear(),a.getMonth(),a.getDate(),+hm[0]-3,+hm[1])),f=function(d){return d.getUTCFullYear()+z(d.getUTCMonth()+1)+z(d.getUTCDate())+"T"+z(d.getUTCHours())+z(d.getUTCMinutes())+"00Z"};L.push("DTSTART:"+f(u),"DTEND:"+f(new Date(u.getTime()+18e5)))}
      else L.push("DTSTART;VALUE=DATE:"+dz(x.pub),"DTEND;VALUE=DATE:"+dz(ymd(addDays(pd(x.pub),1))));
      L.push("SUMMARY:"+e(fmtName(x.format)+": "+x.title),"DESCRIPTION:"+info,"END:VEVENT")}

  else if(a==="group"){S.group=el.dataset.id;render()}
  else if(a==="newat"){ev.stopPropagation();var pre={pub:el.dataset.d};if(el.dataset.f){pre.format=el.dataset.f;pre.pubTime=(rulesFor(S.brand)[el.dataset.f]||{}).time||""}openItem(null,pre)}
  else if(a==="calnav"){var n=+el.dataset.n;if(!n)S.calDate=new Date();else if(S.calMode==="week")S.calDate=addDays(S.calDate,7*n);else S.calDate=new Date(S.calDate.getFullYear(),S.calDate.getMonth()+n,1);render()}
  else if(a==="calmode"){S.calMode=el.dataset.m;render()}
  else if(a==="go"){saveItem(el.dataset.to)}
  else if(a==="slot"){var sl=nextSlot($("fBrand").value,$("fFormat").value,S.ctx.id);if(sl){$("fPub").value=sl.date;if(sl.time)$("fPubTime").value=sl.time;$("slotHint").textContent="Поставлено "+dShort(sl.date)}else $("slotHint").textContent="Для этого формата регламент не задан («Ещё → Регламент публикаций»)"}
  else if(a==="ygretry"){var rid=S.ctx.id;closePanel();await ygSync(rid);if(!S.ygFail[rid])toast("Передано в YouGile")}
  else if(a==="ygoff"){if(!el.dataset.armed){el.dataset.armed="1";el.textContent="Точно отключить?";return}try{await mutate(function(d){d.yg=null});closePanel();toast("YouGile отключён")}catch(e){toast(failMsg(e))}}
  else if(a==="caloff"){if(!el.dataset.armed){el.dataset.armed="1";el.textContent="Точно выключить?";return}el.disabled=true;try{var cf=S.data.cal.file,g=await gh(S.vault.site+"/contents/"+cf+"?t="+Date.now());if(g.ok)await gh(S.vault.site+"/contents/"+cf,{method:"DELETE",body:JSON.stringify({message:"Календарь выключен",sha:(await g.json()).sha})});await mutate(function(d){d.cal=null});closePanel();toast("Ссылка выключена")}catch(e){el.disabled=false;toast(failMsg(e))}}
  else if(a==="copycal"){var u=$("calLink").textContent;try{await navigator.clipboard.writeText(u);toast("Ссылка скопирована")}catch(e){var rg=document.createRange();rg.selectNodeContents($("calLink"));var se=getSelection();se.removeAllRanges();se.addRange(rg);toast("Выделено: скопируйте Ctrl+C")}}
  else if(a==="import"){openImport()}
  else if(a==="rules"){openRules()}
  else if(a==="people"){openPeople()}
  else if(a==="brands"){openBrands()}
  else if(a==="yg"){openYg()}
  else if(a==="ical"){openIcal()}
  else if(a==="passwd"){openPasswd()}
  else if(a==="export"){exportCsv()}
  else if(a==="who"){S.me=null;ls("kp.me",null);authView("who")}
  else if(a==="iam"){if(DEMO)setMe(el.dataset.id);else{S.pinFor=el.dataset.id;authView("pin");$("pin").focus()}}
  else if(a==="genpass"){var al="abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789",o="",rv=rnd(20);for(var gi=0;gi<20;gi++)o+=al[rv[gi]%al.length];$("password").value=o.replace(/(.{5})(?=.)/g,"$1-")}
  else if(a==="logout"){if(DEMO){toast("В демо-просмотре входа нет");return}ls("kp.dek",null);location.reload()}
  else if(a==="close"){closePanel()}
  else if(a==="del"){
    if(!S.ctx||!S.ctx.id)return;
    if(!S.ctx.delArmed){S.ctx.delArmed=true;el.textContent="Точно удалить?";return}
    el.disabled=true;var did=S.ctx.id;
    try{await mutate(function(d){var yid=d.items[did]&&d.items[did].ygId;if(yid&&d.yg){d.yg.skip=d.yg.skip||{};d.yg.skip[yid]=1}delete d.items[did]});closePanel();toast("Удалено")}catch(e){el.disabled=false;toast(failMsg(e))}
  }
});
document.addEventListener("keydown",function(ev){
  if(ev.key==="Escape"&&!$("scrim").hidden)closePanel();
  if(ev.key==="Enter"&&ev.target.classList&&ev.target.classList.contains("card"))openItem(ev.target.dataset.id);
});
document.addEventListener("input",function(ev){if(ev.target.id==="q"){S.q=ev.target.value;render()}});
if(DEMO)window.__kp={S:S,icsText:icsText,nextSlot:nextSlot};
document.querySelectorAll("[data-hk]").forEach(function(i){i.src=IMG[i.dataset.hk]});
boot();
})();
</script>
</body>
</html>
